<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>

    <h2>Application Form</h2>
    <p>Student Internship application - * Required</p>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Full name *</label><br>
            <input type="text" placeholder="Aarav Sharma" required>
            <br><br>

            <label>Email *</label><br>
            <input type="email" placeholder="aarav@example.com" required>
            <br><br>

            <label>Password *</label><br>
            <input type="password" required minlength="6">
            <br><br>

            <label>Phone *</label><br>
            <input type="tel" placeholder="9876543210" required>
            <br><br>

            <label>Portfolio URL</label><br>
            <input type="url" placeholder="https://example.com">
            <br><br>

            <label>Age *</label><br>
            <input type="number" min="18" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other / prefer not to say

        </fieldset>

        <!-- Education and Extras will be added in Commit 2 -->

    </form>

</body>
</html>
</body>
</html>
