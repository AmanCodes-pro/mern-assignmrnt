<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
</head>
<body>

    <h2>Application Form</h2>
    <p>Student Internship application - * Required</p>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Full name *</label><br>
            <input type="text" placeholder="Aarav Sharma" required>
            <br><br>

            <label>Email *</label><br>
            <input type="email" placeholder="aarav@example.com" required>
            <br><br>

            <label>Password *</label><br>
            <input type="password" required minlength="6">
            <br><br>

            <label>Phone *</label><br>
            <input type="tel" placeholder="9876543210" required>
            <br><br>

            <label>Portfolio URL</label><br>
            <input type="url" placeholder="https://example.com">
            <br><br>

            <label>Age *</label><br>
            <input type="number" min="18" required>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other / prefer not to say

        </fieldset>

        <!-- Education and Extras will be added in Commit 2 -->
         <fieldset>
            <legend>Education</legend>

            <label>Course *</label><br>
            <select required>
                <option>BTech – Computer Science</option>
                <option>BTech – Mechanical</option>
                <option>BTech – Electrical</option>
                <option>BCA</option>
            </select>
            <br><br>

            <label>Preferred city (datalist)</label><br>
            <input list="cities" placeholder="Delhi">

            <datalist id="cities">
                <option value="Delhi">
                <option value="Mumbai">
                <option value="Lucknow">
                <option value="Bangalore">
            </datalist>
            <br><br>

            <label>Skills:</label>
            <input type="checkbox"> HTML
            <input type="checkbox"> CSS
            <input type="checkbox"> JavaScript

        </fieldset>

        <br>

        <fieldset>
            <legend>Upload & Extras</legend>

            <label>Available from</label><br>
            <input type="date">
            <br><br>

            <label>Interview time</label><br>
            <input type="time">
            <br><br>

            <label>Resume *</label><br>
            <input type="file" required>
            <br><br>

            <label>Expected monthly stipend: ₹10,000</label><br>
            <input type="range" min="5000" max="20000" value="10000">
            <br><br>

            <label>Favourite colour:</label>
            <input type="color">
            <br><br>

            <label>Why would you like to join?</label><br>
            <textarea rows="4" cols="50" placeholder="Write your answer here..."></textarea>
            <br><br>

            <button type="submit">Submit application</button>
            <button type="reset">Reset</button>

        </fieldset>

    </form>

</body>
</html>
</body>
</html>
